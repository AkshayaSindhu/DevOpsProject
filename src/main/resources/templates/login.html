
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Complaint System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0ff, #f8fbff);
        }

        .login-card {
            width: 100%;
            max-width: 410px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 40, 100, 0.12);
        }

        .icon {
            text-align: center;
            font-size: 42px;
        }

        h1 {
            margin-bottom: 8px;
            text-align: center;
            color: #183b70;
            font-size: 25px;
        }

        .subtitle {
            margin-bottom: 28px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            color: #26364b;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93b4ff;
            border-color: #315fbd;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2455a4;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #183f80;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .logout {
            background: #dcfce7;
            color: #166534;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>
<div class="login-card">

    <div class="icon">🎓</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Student Complaint Management System
    </p>

    <form th:action="@{/login}" method="post">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
            autofocus>

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

        <button type="submit">Login</button>

    </form>

    <div th:if="${param.error}" class="message error">
        Invalid username or password.
    </div>

    <div th:if="${param.logout}" class="message logout">
        You have logged out successfully.
    </div>

    <div class="footer">
        © Student Complaint Management System
    </div>

</div>
</body>
</html>
