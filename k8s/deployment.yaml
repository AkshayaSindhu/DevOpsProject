
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-complaint-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-complaint-system
  template:
    metadata:
      labels:
        app: student-complaint-system
    spec:
      containers:
        - name: student-complaint-system
          image: student-complaint-system:6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
